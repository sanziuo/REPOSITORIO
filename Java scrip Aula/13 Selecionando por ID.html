<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exemplo 1: Selecionando Por ID</title>
        <!-- Referências a arquivos externos (Opcional) -->
    </head>
    <body>
        <div id="minhaDiv" style="background-color: aqua;">
        "Este é um elemento DIV"</div>

        <script>
            // Seleciona o elemento por ID
            const elemento = document.getElementById('minhaDiv');
            // Exibe o conteúdo do elemento no console
            console.log(elemento.textContent);
        </script>
    </body>
</html>
