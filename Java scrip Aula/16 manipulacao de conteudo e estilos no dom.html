<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exemplo de manipulação de contúdo no DOM</title>
    </head>
    <body>
        <div id="minhaDiv">Este é um elemento DIV</div>

        <script>
            // Exemplo de manipulação de conteúdo no DOM
            const minhaDiv = document.getElementById('minhaDiv'); // Cria um novo elemento DIV
            minhaDiv.style.backgroundColor = 'blue'; // Define a cor de fundo do DIV
            minhaDiv.style.color = 'white'; // Define a cor do texto do DIV
            minhaDiv.style.padding = '10px'; // Adiciona preenchimento ao DIV
            minhaDiv.style.border = '5px'; // Adiciona uma borda ao DIV
        </script>
    </body>
</html>
