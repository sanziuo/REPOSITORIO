<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exemplo 2: Selecionando com querySelector</title>
    </head>
    <body>
        <div class="conteudo">
            <p>Este é um Parágrafo dentro da div com a classe "conteudo"</p>
        </div> 

        <script>
            // Seleciona o elemento com querySelector
            const elemento = document.querySelector('.conteudo p');
            // Exibe o conteúdo parágrafo no console
            console.log(elemento.textContent);
        </script>
    </body>
</html>
