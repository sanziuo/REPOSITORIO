spring.application.name=restaurante

# Banco H2 em memória (some quando a aplicação para)
spring.datasource.url=jdbc:h2:mem:restaurantebd
spring.datasource.username=sa
spring.datasource.password=

# Interface web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# update: cria/ajusta tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# mostra no console o SQL gerado pelo Hibernate
spring.jpa.show-sql=true