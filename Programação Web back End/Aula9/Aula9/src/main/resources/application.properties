# Nome da aplicação
spring.application.name=restaurante

# ===== MySQL (container Docker) =====
# Endereço do banco: porta 3307 (Docker), banco "restaurantebd"
spring.datasource.url=jdbc:mysql://localhost:3307/restaurantebd
# Driver de conexão do MySQL
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# Usuário e senha (os mesmos do .env)
spring.datasource.username=restaurante_user
spring.datasource.password=restaurante_pass

# ===== JPA / Hibernate =====
# update: cria as novas tabelas (venda, venda_produto) sem apagar os produtos
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL executado
spring.jpa.show-sql=true
# Formata o SQL mostrado
spring.jpa.properties.hibernate.format_sql=true

