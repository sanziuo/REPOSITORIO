<!DOCTYPE html>
<!-- habilita os atributos th:* -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- com id = edição; sem id = cadastro -->
    <title th:text="${produto.id} != null ? 'Editar Produto' : 'Cadastrar Produto'"></title>
    <link rel="stylesheet" th:href="@{/produto/produtos.css}">
</head>
<body>
<h1 th:text="${produto.id} != null ? 'Editar Produto' : 'Cadastrar Produto'"></h1>

<!-- th:action: envia para POST /produtos | th:object: liga ao objeto "produto" -->
<!-- novalidate: desliga a validação do navegador para testar a do Spring -->
<form th:action="@{/produtos}" th:object="${produto}" method="post" novalidate>

    <!-- Aviso geral: #fields só funciona DENTRO do elemento com th:object -->
    <p class="alerta" th:if="${#fields.hasAnyErrors()}">
        Corrija os campos destacados abaixo.
    </p>

    <!-- id oculto: vazio no cadastro, preenchido na edição -->
    <input type="hidden" th:field="*{id}">

    <!-- NOME -->
    <label>Nome:</label>
    <!-- th:errorclass: adiciona a classe "campo-erro" quando o campo tem erro -->
    <input type="text" th:field="*{nome}" th:errorclass="campo-erro">
    <!-- th:errors: mostra a mensagem definida no @NotBlank/@Size do DTO -->
    <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

    <!-- PREÇO -->
    <label>Preço:</label>
    <input type="number" step="0.01" th:field="*{preco}" th:errorclass="campo-erro">
    <span class="erro" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></span>

    <!-- CATEGORIA -->
    <label>Categoria:</label>
    <input type="text" th:field="*{categoria}" th:errorclass="campo-erro">
    <span class="erro" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>

    <!-- DESCRIÇÃO -->
    <label>Descrição:</label>
    <textarea th:field="*{descricao}" rows="3" th:errorclass="campo-erro"></textarea>
    <span class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>

    <button type="submit">Salvar</button>
    <!-- volta sem salvar -->
    <a th:href="@{/produtos}">Cancelar</a>
</form>
</body>
</html>
