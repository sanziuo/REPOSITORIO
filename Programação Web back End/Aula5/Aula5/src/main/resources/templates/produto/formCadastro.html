<!DOCTYPE html>
<!-- habilita os atributos th:* -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Título muda: com id = edição; sem id = cadastro (operador ternário) -->
    <title th:text="${produto.id} != null ? 'Editar Produto' : 'Cadastrar Produto'"></title>
    <link rel="stylesheet" th:href="@{/produto/produtos.css}">
</head>
<body>
<h1 th:text="${produto.id} != null ? 'Editar Produto' : 'Cadastrar Produto'"></h1>

<!-- th:action: envia para POST /produtos
     th:object: liga o formulário ao objeto "produto" enviado pelo Controller -->
<form th:action="@{/produtos}" th:object="${produto}" method="post">

    <!-- Campo oculto com o id: vazio no cadastro, preenchido na edição -->
    <input type="hidden" th:field="*{id}">

    <!-- th:field="*{nome}" liga o campo ao atributo produto.nome -->
    <label>Nome:</label>
    <input type="text" th:field="*{nome}" required>

    <label>Preço:</label>
    <input type="number" step="0.01" th:field="*{preco}" required>

    <label>Categoria:</label>
    <input type="text" th:field="*{categoria}">

    <!-- Novo campo do exercício -->
    <label>Descrição:</label>
    <textarea th:field="*{descricao}" rows="3"></textarea>

    <button type="submit">Salvar</button>
    <!-- Volta para a listagem sem salvar -->
    <a th:href="@{/produtos}">Cancelar</a>
</form>
</body>
</html>
