# Nome da aplicação
spring.application.name=restaurante

# Endereço do banco: H2 em memória chamado "restaurantebd" (apaga ao parar)
spring.datasource.url=jdbc:h2:mem:restaurantebd
# Driver de conexão do H2
spring.datasource.driverClassName=org.h2.Driver
# Usuário do banco
spring.datasource.username=sa
# Senha do banco (vazia)
spring.datasource.password=

# Liga o console web do H2
spring.h2.console.enabled=true
# Endereço do console: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# Dialeto SQL do H2 usado pelo Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL executado
spring.jpa.show-sql=true
# Formata o SQL mostrado
spring.jpa.properties.hibernate.format_sql=true