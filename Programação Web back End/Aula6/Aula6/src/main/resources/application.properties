# Nome da aplicação
spring.application.name=restaurante

# ===== MySQL (container Docker) =====
# Endereço do banco: servidor local, porta 3307 (Docker), banco "restaurantebd"
# (3307 porque a 3306 está ocupada por outro MySQL instalado no Windows)
spring.datasource.url=jdbc:mysql://localhost:3307/restaurantebd
# Driver de conexão do MySQL
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# Usuário e senha (os mesmos definidos no .env / docker-compose.yml)
spring.datasource.username=restaurante_user
spring.datasource.password=restaurante_pass

# ===== JPA / Hibernate =====
# update: cria/ajusta as tabelas sem apagar os dados
# (exercício: troque para "validate" para só conferir a estrutura, sem alterar)
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL executado
spring.jpa.show-sql=true
# Formata o SQL mostrado
spring.jpa.properties.hibernate.format_sql=true

