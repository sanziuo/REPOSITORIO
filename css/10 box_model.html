<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exemplo de Box Model</title>
        <style>
            .box {
                width: 200px;
                height: 150px;
                padding: 10px;
                border: 10px solid #007bff;
                margin: 20px;
                background-color: #f5f5f5;
                box-sizing: border-box; /* Inclui padding e border no tamanho total */           
            }
        </style>
    </head>
    <body>
        <div class="box">
            <p>Conteúdo dentro da caixa.</p>
        </div>
    </body>
</html>
