<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exemplo de CSS Incorporado</title>
        <style>
            p {
                color: red;
                font-size: 18px;
            }
            .destaque {
                background-color: yellow;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <p>Este é um parágrafo estilizado com CSS incorporado.</p>
        <p class="destaque">Este parágrafo possui uma classe de destaque.</p>
    </body>
</html>
