<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Loyout com flexbox</title>
        <style>
            /* Estilos para o posicionamento fixo */
            .container {
                display: flex;
                justify-content: space-between;
            }

            .item {
                flex: 1; /* Cada item ocupa o mesmo espaço */
                margin: 10px;
                padding: 20px;
                background-color: #f2f2f2;
            }
        </style>  
    </head>
    <body>
        <div class="container">
            <div class="item"> Item 1</div>
            <div class="item"> Item 2</div>
            <div class="item"> Item 3</div>
      
        </div>
    </body>
</html>
