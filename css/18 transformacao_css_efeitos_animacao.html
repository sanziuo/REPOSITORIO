<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Estilização de formulários</title>
        <style>
            .box {               
                width: 100px;
                height: 100px;
                background-color: #007bff;
                transition:all 0.3s ease;
            }
            .box:hover {
                transform: rotate(45deg) scale(1.2);
                background-color: #ff6347;
            }           
        </style>  
    </head>
    <body>
        <div class="box"></div>      
    </body>
</html>
