<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exemplo de Estilização CSS</title>
        <style>
           /* Seletor de elemento */
            p {
                font-size: 16px;
                color: #333;
            }
            
            /* Seletor de classe */
            .destaque {
                font-weight: yellow;
                color: #007bff;
            }
        </style>    
    </head>
    <body>
         <!-- Elemento com a classe "destaque" -->
        <p class="destaque">Este é um texto de destaque.</p>
    </body>
</html>
