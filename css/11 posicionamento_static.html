<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Posicionamento Estático</title>
        <style>
            /* Posicionamento estático */
            .elemento-static{
                position:static;
            }
        </style>  
    </head>
    <body>
        <div class="elemento-static">
            Este elemento está posicionado de forma estática.
        </div>
    </body>
</html>
