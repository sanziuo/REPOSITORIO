<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Estilização de formulários</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                text-align: center;
            }
            .container {
                width: 100%;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
            }
            @media screen and (max-width: 600px) {
                .container {
                    padding: 10px;
                }
            }
        </style>  
    </head>
    <body>
        <div class="container"><
            <h1>Exemplo ao Média Queries</h1>
            <p>Este exemplo de página web com Media Queries.
            O Layout se adapta ao tamanho da tela do dispositivo.</p>
        </div>        
    </body>
</html>
