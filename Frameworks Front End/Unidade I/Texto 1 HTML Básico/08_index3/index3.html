<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Tabelas</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <!-- Tabela básica do slide -->
        <table border="1">
            <tr>
                <td>Linha 1, célula 1</td>
                <td>Linha 1, célula 2</td>
            </tr>
            <tr>
                <td>Linha 2, célula 1</td>
                <td>Linha 2, célula 2</td>
            </tr>
        </table>

        <br>

        <!-- Exemplo com os atributos apresentados (align, width, th, valign) -->
        <table border="1" align="center" width="300">
            <tr>
                <th align="center">Cabeçalho 1</th>
                <th align="center">Cabeçalho 2</th>
            </tr>
            <tr>
                <td align="left" valign="top" height="60">Esquerda / topo</td>
                <td align="right" valign="bottom" height="60">Direita / inferior</td>
            </tr>
            <tr>
                <td align="center" valign="middle" height="60">Centro / meio</td>
                <td align="justify">Texto justificado dentro da célula da tabela.</td>
            </tr>
        </table>
    </body>
</html>
