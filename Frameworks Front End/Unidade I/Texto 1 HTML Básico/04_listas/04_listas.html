<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>
        Página de Exemplo
        </title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h2>Uma lista HTML não ordenada</h2>
        <ul>
            <li>Café</li>
            <li>Chá</li>
            <li>Leite</li>
        </ul>

        <h2>Uma lista HTML ordenada</h2>
        <ol>
            <li>Café</li>
            <li>Chá</li>
            <li>Leite</li>
        </ol>
    </body>
</html>
