<!DOCTYPE HTML>
<html lang="pt-br">
    <head>
        <title>Exemplo de Função prompt box outro exemplo</title>
        <meta charset="UTF-8">
    </head>
    <body>
    <script>
    var querMsg= confirm("Gostaria de receber uma mensagem de boas vindas?");

    if(querMsg){
        var nome = prompt("Por favor, qual o seu nome?","");
        }
        if(nome != null && nome !=""){
            alert("Olá " + nome + ", seja bem vindo.");
        }
    </script>
    </body>
</html>
