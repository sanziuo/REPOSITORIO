<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>JavaScript - Estruturas de controle</title>
</head>
<body>
    <h2>
    <script type ="text/javascript">
        var data=new Date();
        var dia=data.getDay();
          document.write(dia);
        switch (dia) {
            case 6:
                document.write("- Hoje é sábado.");
                break;
            case 0:
                document.write(" - Hoje é domingo.");
                break;
            default:
                    document.write("- Hoje é dia de semana.");
        }
    </script>
    </h2>
</body>
</html>
