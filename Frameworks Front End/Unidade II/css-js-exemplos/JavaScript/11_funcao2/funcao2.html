<!DOCTYPE HTML>
<html lang="pt-br">
    <head>
        <title>Exemplo de Função na própria página</title>
        <meta charset="UTF-8">
        <script>
            function myFunction()
            {
                alert("Olá! Tudo bem?");
                confirm("Você está estudando JavaScript");
            }
        </script>
    </head>
    <body>
        <button onclick="myFunction()">Clique aqui</button>
        <p>Ao clicar no botão acima, a função será chamada.
        A função se apresenta na caixa de mensagem</p>

    </body>
</html>
