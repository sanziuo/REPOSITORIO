<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dobro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Times New Roman', Times, serif;
      font-size: 16px;
      color: #1a1a1a;
      background: #ffffff;
      margin: 0;
      padding: 22px;
    }
    .linha { margin-bottom: 6px; }
    label { font-size: 16px; }
    input[type=text] {
      font-family: 'Times New Roman', Times, serif;
      font-size: 15px;
      padding: 3px 6px;
      border: 1px solid #8a8a8a;
      border-radius: 2px;
    }
    input[type=text]:focus { outline: 2px solid #f0a500; outline-offset: -1px; }
    input[readonly] { background: #f3f3f3; }
    button {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      padding: 4px 12px;
      border: 1px solid #a0a0a0;
      border-radius: 3px;
      background: linear-gradient(#fbfbfb, #e6e6e6);
      color: #222;
      cursor: pointer;
    }
    button:hover { background: linear-gradient(#ffffff, #dcdcdc); }
    button:active { background: #d5d5d5; }
  </style>
</head>
<body>
  <div class="linha">
    <label for="valor">Digite um valor: </label>
    <input type="text" id="valor" size="14">
  </div>
  <div class="linha">
    <button onclick="mostrarDobro()">Mostrar o dobro</button>
  </div>
  <div class="linha">
    <label for="dobro">Dobro do valor: </label>
    <input type="text" id="dobro" size="14" readonly>
  </div>

  <script>
    function mostrarDobro() {
      const entrada = document.getElementById("valor").value;
      const numero = parseFloat(entrada);
      const saida = document.getElementById("dobro");

      // Valida se o usuário digitou um número
      if (entrada.trim() === "" || isNaN(numero)) {
        alert("Por favor, digite um número válido.");
        saida.value = "";
        return;
      }

      // Exibe o dobro dentro da caixa de texto "Dobro do valor"
      saida.value = numero * 2;
    }
  </script>
</body>
</html>
