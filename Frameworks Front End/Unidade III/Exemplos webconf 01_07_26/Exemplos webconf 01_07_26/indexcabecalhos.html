<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cabeçalhos com Bootstrap</title>

  <!-- Link do Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<body>

  <div class="container mt-5">

    <h1 class="text-primary">Cabeçalho h1 azul</h1>
    <h2 class="text-success">Cabeçalho h2 verde</h2>
    <h3 class="text-danger">Cabeçalho h3 vermelho</h3>
    <h4 class="text-warning">Cabeçalho h4 amarelo</h4>
    <h5 class="text-secondary">Cabeçalho h5 cinza</h5>
    <h6 class="text-muted">Cabeçalho h6 apagado</h6>

    <hr>

    <h1 class="text-center">Cabeçalho centralizado</h1>

    <h2 class="bg-primary text-white p-3">
      Cabeçalho com fundo azul
    </h2>

    <h2 class="border-bottom border-primary pb-2">
      Cabeçalho com linha embaixo
    </h2>

    <h2 class="text-uppercase">
      Cabeçalho em letras maiúsculas
    </h2>

    <h2 class="fw-bold">
      Cabeçalho em negrito
    </h2>

  </div>

  <!-- JavaScript do Bootstrap -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

<!-- colocar o link do JavaScript do Bootstrap no final do código 
(antes de fechar a tag </body>) é uma boa prática focada em desempenho e 
funcionalidade. Isso garante que a página carregue o mais rápido possível e 
que os elementos visuais estejam prontos antes de o script tentar interagir com eles. -->
</body>
</html>
