<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Cores de Fundo com Bootstrap</title>

  <!-- Link do Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<body>

  <div class="container mt-5">

    <h1 class="mb-4">Cores de fundo no Bootstrap</h1>

    <div class="bg-primary text-white p-3 mb-3">
      Fundo azul: bg-primary
    </div>

    <div class="bg-secondary text-white p-3 mb-3">
      Fundo cinza: bg-secondary
    </div>

    <div class="bg-success text-white p-3 mb-3">
      Fundo verde: bg-success
    </div>

    <div class="bg-danger text-white p-3 mb-3">
      Fundo vermelho: bg-danger
    </div>

    <div class="bg-warning text-dark p-3 mb-3">
      Fundo amarelo: bg-warning
    </div>

    <div class="bg-info text-dark p-3 mb-3">
      Fundo azul claro: bg-info
    </div>

    <div class="bg-light text-dark p-3 mb-3 border">
      Fundo claro: bg-light
    </div>

    <div class="bg-dark text-white p-3 mb-3">
      Fundo escuro: bg-dark
    </div>

  </div>

  <!-- JavaScript do Bootstrap -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

<!-- colocar o link do JavaScript do Bootstrap no final do código 
(antes de fechar a tag </body>) é uma boa prática focada em desempenho e 
funcionalidade. Isso garante que a página carregue o mais rápido possível e 
que os elementos visuais estejam prontos antes de o script tentar interagir com eles. -->

</body>
</html>
