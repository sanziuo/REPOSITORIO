<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Tabelas com Bootstrap</title>

  <!-- Link do Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<body>

  <div class="container mt-5">

    <h1 class="mb-4">Exemplo de Tabela com Bootstrap</h1>

    <!-- Tabela simples com Bootstrap -->
    <table class="table">

      <thead>
        <tr>
          <th>Nome</th>
          <th>Curso</th>
          <th>Nota</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Ana</td>
          <td>Informática</td>
          <td>9,0</td>
        </tr>

        <tr>
          <td>Bruno</td>
          <td>Redes</td>
          <td>8,5</td>
        </tr>

        <tr>
          <td>Carla</td>
          <td>Programação</td>
          <td>10,0</td>
        </tr>
      </tbody>

    </table>

    <hr>

    <h2 class="mt-4">Tabela com mais estilos</h2>

    <!-- Tabela com bordas, listras e efeito ao passar o mouse -->
    <table class="table table-bordered table-striped table-hover mt-3">

      <thead class="table-dark">
        <tr>
          <th>Código</th>
          <th>Produto</th>
          <th>Preço</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>001</td>
          <td>Teclado</td>
          <td>R$ 80,00</td>
        </tr>

        <tr>
          <td>002</td>
          <td>Mouse</td>
          <td>R$ 45,00</td>
        </tr>

        <tr>
          <td>003</td>
          <td>Monitor</td>
          <td>R$ 750,00</td>
        </tr>
      </tbody>

    </table>

  </div>

  <!-- JavaScript do Bootstrap -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
